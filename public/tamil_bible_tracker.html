                  onClick: () => toggleVerse(selectedBook.id, selectedChapter, vNum),

              })
            )
          ) : null,

          // VIEW: REPORTS
          view === 'reports' ? React.createElement('div', { className: 'space-y-5' },

            React.createElement('div', { className: 'p-6 rounded-2xl bg-gradient-to-br from-slate-800 to-amber-950/30 border border-amber-500/40 text-center' },

              React.createElement('div', { className: 'text-4xl font-black text-amber-400 my-2' }, `${percentVerses}%`),
              React.createElement('div', { className: 'text-sm text-slate-300' }, `${totalVersesRead.toLocaleString()} / 31,102 வசனங்கள் வாசிக்கப்பட்டது`)
            ),
            React.createElement('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-4' },
              React.createElement('div', { className: 'p-4 rounded-xl bg-slate-800 border border-slate-700' },
                React.createElement('h3', { className: 'font-bold text-amber-400' }, "பழைய ஏற்பாடு (Old Testament)"),
                React.createElement('p', { className: 'text-xs text-slate-400 mt-1' }, "39 புத்தகங்கள் • 929 அதிகாரங்கள் • 23,145 வசனங்கள்")
              ),
              React.createElement('div', { className: 'p-4 rounded-xl bg-slate-800 border border-slate-700' },
                React.createElement('h3', { className: 'font-bold text-emerald-400' }, "புதிய ஏற்பாடு (New Testament)"),
                React.createElement('p', { className: 'text-xs text-slate-400 mt-1' }, "27 புத்தகங்கள் • 260 அதிகாரங்கள் • 7,957 வசனங்கள்")
              )
            )
          ) : null,

          // VIEW: ABOUT US
          view === 'about' ? React.createElement('div', { className: 'space-y-5 max-w-xl mx-auto text-center' },
            React.createElement('div', { className: 'p-6 rounded-2xl bg-slate-900 border-2 border-amber-500/50' },
              React.createElement('div', { className: 'text-3xl text-amber-400 mb-2' }, "✝"),
              React.createElement('h1', { className: 'text-xl font-bold text-amber-400 uppercase' }, "JESUS CHRIST'S LOVING MINISTRY"),
              React.createElement('p', { className: 'text-base font-semibold text-slate-100' }, "இயேசு கிறிஸ்துவின் அன்பின் ஊழியம்"),
              React.createElement('p', { className: 'text-xs tracking-widest text-slate-400 uppercase mt-1' }, "BY P. PETHURAJ"),
              React.createElement('button', {
                onClick: () => setShowSplash(true),
                className: 'mt-4 px-4 py-2 rounded-full bg-slate-800 text-xs font-semibold text-amber-300 border border-slate-700'
              }, "அறிமுகத் திரையைக் காண்க (Play Welcome Screen)")
            ),

            React.createElement('div', { className: 'p-5 rounded-2xl bg-slate-800 border border-emerald-500/50 text-left' },
              React.createElement('div', { className: 'text-xs text-emerald-400 font-bold uppercase' }, "வாட்ஸ்அப் தொடர்பு (WhatsApp)"),
              React.createElement('div', { className: 'text-xl font-bold text-slate-100 mt-0.5' }, "+919840041759"),
              React.createElement('p', { className: 'text-xs text-slate-400 mt-1' }, "ஜெப விண்ணப்பங்கள் மற்றும் ஆலோசனைகளுக்கு வாட்ஸ்அப்பில் தொடர்பு கொள்ளவும்."),
              React.createElement('a', {
                href: 'https://wa.me/919840041759?text=%E0%AE%B5%E0%AE%A3%E0%AE%95%E0%AF%8D%E0%AE%95%E0%AE%AE%E0%AF%8D%20%E0%AE%85%E0%AE%AF%E0%AF%8D%E0%AE%AF%E0%AE%BE',
                target: '_blank',
                rel: 'noopener noreferrer',
                className: 'mt-3 inline-block px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-xs shadow-md'
              }, "வாட்ஸ்அப்பில் செய்தி அனுப்ப →")
            )
          ) : null
        )
      );
    }

    ReactDOM.render(React.createElement(StandaloneApp), document.getElementById('root'));
  </script>
